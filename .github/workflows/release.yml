name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Set up signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.PRISM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the PRISM_KEYSTORE_BASE64 and PRISM_KEYSTORE_PASSWORD repository secrets first. Releases must always be signed with the same key, or in-app updates can't install."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "PRISM_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          PRISM_KEYSTORE_PASSWORD: ${{ secrets.PRISM_KEYSTORE_PASSWORD }}
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          export PRISM_VERSION="$VERSION"
          export PRISM_KEY_ALIAS="prism"
          export PRISM_KEY_PASSWORD="$PRISM_KEYSTORE_PASSWORD"
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          NAME="PrismPlayer-${VERSION}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "APK=$NAME" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Prism Player ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: ${{ env.APK }}
          generate_release_notes: true
          body: |
            Prism Player for Android TV, phones and tablets (one APK for all).

            **Install:** download `${{ env.APK }}` below.
            - Phone: open the file and allow installing from unknown sources.
            - Android TV: `adb install -r ${{ env.APK }}` or sideload with an app like Downloader.

            Already installed? Open **Settings → Updates** in the app, or wait for the update card on the home screen.

            New here? Open the app and choose **Try the demo** to browse a sample library of open movies.
